name: Offline contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Determinism and offline checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run dependency-free test suite
        run: node --test
